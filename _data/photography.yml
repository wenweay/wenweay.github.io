# Photography page content.
# To add a photo: put <slug>-1200.jpg and <slug>-2400.jpg in images/photography/,
# add an entry under `photos` (width/height of the 2400 version), then place the
# slug in a row. Photos in the same row are shown at the same height.
intro: Photography is what I do away from the lab. These are landscapes from places I have lived in and travelled through, from the Dolomites to the Peruvian Andes.
hero: tre-cime
sections:
- title: Italy
  rows:
  - - cadini
    - vernazza
  - - naples
    - cinque-terre
  - - florence-dusk
    - florence-night
- title: Peru
  rows:
  - - rainbow-1
  - - lima
    - arequipa
  - - rainbow-2
- title: Elsewhere in Europe
  rows:
  - - alps
    - copenhagen
